name: Feature request
description: Suggest an improvement for EZ Zoom
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe the user need before proposing an implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what limitation are you encountering?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like EZ Zoom to provide.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you have considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any non-sensitive examples or context that would clarify the request.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request concerns webpage magnification, accessibility, zoom controls, or closely related behavior.
          required: true
