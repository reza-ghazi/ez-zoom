<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 330px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    padding: 16px;
  }
  header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  header img { width: 28px; height: 28px; }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .2px; }
  .card {
    background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .card h2 {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: #64748b; margin-bottom: 12px;
  }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: #38bdf8; }
  select {
    flex: 1; background: #334155; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px;
  }
  .val {
    min-width: 52px; text-align: right; font-variant-numeric: tabular-nums;
    color: #38bdf8; font-weight: 700;
  }
  .hint { font-size: 11.5px; color: #94a3b8; margin-top: 6px; }
  .field + .field { margin-top: 14px; }
  .switchrow {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .switchrow label { margin-bottom: 0; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; border-radius: 999px; background: #475569;
    transition: .2s; cursor: pointer;
  }
  .slider::before {
    content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    border-radius: 50%; background: #fff; transition: .2s;
  }
  .switch input:checked + .slider { background: #38bdf8; }
  .switch input:checked + .slider::before { transform: translateX(18px); }
  .shortcuts { font-size: 12.5px; color: #cbd5e1; }
  .shortcuts b { color: #f1f5f9; }
  .kbd {
    display: inline-block; padding: 1px 6px; border-radius: 5px;
    background: #334155; border: 1px solid #475569;
    font: 600 11px/1.5 ui-monospace, monospace; color: #f1f5f9;
  }
  button {
    width: 100%; padding: 9px 0; border: 0; border-radius: 9px;
    background: #334155; color: #e2e8f0; font-weight: 600; font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #3e4f68; }
  .saved {
    text-align: center; font-size: 11.5px; color: #4ade80; height: 14px;
    margin-top: 8px; opacity: 0; transition: opacity .25s;
  }
  .saved.show { opacity: 1; }
  .dim { opacity: .45; pointer-events: none; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <h1>EZ Zoom</h1>
  </header>

  <div class="card">
    <h2>Hold-key zoom</h2>

    <div class="field switchrow">
      <label for="holdEnabled">Enable hold-key zoom</label>
      <span class="switch">
        <input type="checkbox" id="holdEnabled" checked>
        <span class="slider"></span>
      </span>
    </div>

    <div id="holdGroup">
      <div class="field">
        <label for="modifier">Hold key</label>
        <div class="row">
          <select id="modifier">
            <option value="Control">Ctrl</option>
            <option value="Alt">Alt</option>
            <option value="Shift">Shift</option>
            <option value="Meta">Cmd / Win</option>
          </select>
        </div>
        <div class="hint">
          Hold + hover = zoom at pointer. Hold + drag = zoom into a rectangle.
          Release = zoom back out.
        </div>
      </div>

      <div class="field">
        <label for="hoverZoom">Hover zoom level</label>
        <div class="row">
          <input type="range" id="hoverZoom" min="1.2" max="6" step="0.1" value="2">
          <span class="val" id="hoverZoomVal">2.0&times;</span>
        </div>
      </div>

      <div class="field switchrow">
        <label for="follow">Follow pointer while held<br>
          <span class="hint" style="margin-top:2px">Off = freeze at the first spot</span>
        </label>
        <span class="switch">
          <input type="checkbox" id="follow" checked>
          <span class="slider"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Shortcut zoom</h2>

    <div class="field">
      <label for="step">Zoom amount per press</label>
      <div class="row">
        <input type="range" id="step" min="1.1" max="3" step="0.1" value="1.5">
        <span class="val" id="stepVal">1.5&times;</span>
      </div>
    </div>

    <div class="field">
      <label for="maxZoom">Maximum zoom</label>
      <div class="row">
        <input type="range" id="maxZoom" min="2" max="20" step="1" value="8">
        <span class="val" id="maxZoomVal">8&times;</span>
      </div>
    </div>

    <div class="field">
      <label for="duration">Animation smoothness</label>
      <div class="row">
        <input type="range" id="duration" min="0" max="800" step="20" value="280">
        <span class="val" id="durationVal">280ms</span>
      </div>
      <div class="hint">0 = instant, higher = smoother/slower.</div>
    </div>
  </div>

  <div class="card shortcuts">
    <b>Shortcuts</b> (defaults)<br>
    Zoom in&nbsp;&nbsp;<span class="kbd">Alt</span>+<span class="kbd">Shift</span>+<span class="kbd">&uarr;</span><br>
    Zoom out&nbsp;<span class="kbd">Alt</span>+<span class="kbd">Shift</span>+<span class="kbd">&darr;</span><br>
    Reset&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span class="kbd">Alt</span>+<span class="kbd">Shift</span>+<span class="kbd">X</span>
  </div>

  <button id="editShortcuts">Change keyboard shortcuts&hellip;</button>
  <div class="saved" id="saved">Saved ✓</div>

<script src="popup.js"></script>
</body>
</html>
